hugoblox:
  schema: "2.0"
  identity:
    name: Floraison
    type: person
    tagline: CSE | Zhejiang University
    description: FLoraison is a student majoring in CSE at ZJU.
  theme:
    mode: system
    pack: default
    colors:
      primary: "#8B2F2F"
      secondary: "#6B7F5E"
      neutral: "#1F2F3F"
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
